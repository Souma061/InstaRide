name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The aggregate runner (tests/integration_all.ts) hardcodes a Windows path
    # separator and the e2e harness reaps process trees with taskkill /T, so
    # the suite is only verified on Windows. Do not switch this runner without
    # porting those two call sites first.
    runs-on: windows-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      FORCE_COLOR: "0"
      CI: "true"

    steps:
      # Actions are pinned to commit SHAs, not floating tags: an `@v4` tag is
      # mutable, and this workflow runs on every fork PR.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # Two core suites drive engine_bridge.exe through koffi, and the binary is
      # gitignored — a fresh checkout has none until this runs.
      - name: Verify C++ toolchain
        run: |
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\mingw64\bin\g++.exe") { $env:Path += ";C:\mingw64\bin" }
            else { choco install mingw -y --no-progress }
          }
          g++ --version

      - name: Build native engine
        run: pnpm build:cpp

      - name: Test (13 core suites)
        run: pnpm test
